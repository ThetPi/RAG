[project]
name = "llmbasic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
llmbasic = "llmbasic:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
